[package]
name = "brawler-routing"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Bevy-free routing and IPC contracts for Brawler"
publish = false

[[bin]]
name = "brawler-supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
name = "brawler-routing-fake-worker"
path = "src/bin/fake-worker.rs"

[dependencies]
getrandom = "0.3"
mio = { version = "1.2.2", features = ["net", "os-poll"] }
sha2 = "0.10"
ctrlc = "3.5.2"

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
