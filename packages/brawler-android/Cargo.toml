[package]
name = "brawler-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Thin Android (GameActivity) entry point for the PewPew Blitz player client"
publish = false

# Built only by `just android-build` (cargo-ndk, aarch64-linux-android). The library name is the
# `android.app.lib_name` that the Gradle shell's GameActivity loads.
[lib]
name = "brawler_android"
crate-type = ["cdylib"]

[dependencies]
# The BRL-0165 player configuration: no automation, evidence, or developer tooling.
brawler = { path = "../..", default-features = false, features = ["client"] }
brawler-client = { path = "../brawler-client" }
bevy = { version = "=0.19.1", default-features = false, features = [
  "android-game-activity",
  "touch",
] }
# `ANativeWindow_setFrameRate` for the 60 FPS cap (BRL-0161). Already in the graph through
# android-activity; this only enables the native-window API at the shell's minimum SDK (31).
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
ndk = { version = "=0.9.0", default-features = false, features = ["nativewindow", "api-level-30"] }

[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
