plugins {
    id 'com.android.application'
}

// Store signing (BRL-06pz). The Play upload key never lives in git: it comes from
// `keystore.properties` beside settings.gradle (gitignored) or, overriding it, from the
// BRAWLER_UPLOAD_STORE_FILE / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD environment variables.
// Without it, release APKs fall back to the local debug key and store bundles refuse to build.
def uploadKey = [:]
def uploadKeyProperties = rootProject.file('keystore.properties')
if (uploadKeyProperties.exists()) {
    def properties = new Properties()
    uploadKeyProperties.withInputStream { properties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        uploadKey[name] = properties.getProperty(name)
    }
}
[
    storeFile: 'BRAWLER_UPLOAD_STORE_FILE',
    storePassword: 'BRAWLER_UPLOAD_STORE_PASSWORD',
    keyAlias: 'BRAWLER_UPLOAD_KEY_ALIAS',
    keyPassword: 'BRAWLER_UPLOAD_KEY_PASSWORD',
].each { name, variable ->
    def value = System.getenv(variable)
    if (value) {
        uploadKey[name] = value
    }
}
def hasUploadKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { uploadKey[it] }

gradle.taskGraph.whenReady { graph ->
    if (!hasUploadKey && graph.allTasks.any { it.name == 'bundleRelease' }) {
        throw new GradleException(
            'bundleRelease needs the Play upload key: create packages/brawler-android/android/' +
            'keystore.properties (storeFile, storePassword, keyAlias, keyPassword) or set ' +
            'BRAWLER_UPLOAD_STORE_FILE, BRAWLER_UPLOAD_STORE_PASSWORD, BRAWLER_UPLOAD_KEY_ALIAS ' +
            'and BRAWLER_UPLOAD_KEY_PASSWORD. See the Android section of README.md.')
    }
}

android {
    namespace 'com.pewpewblitz.client'
    compileSdk 37
    // Only for stripping/packaging checks; the Rust library is prebuilt by cargo-ndk.
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.pewpewblitz.client'
        // Android 12+. Target 37 (Android 17): LAN access needs the ACCESS_LOCAL_NETWORK runtime
        // permission, which MainActivity requests before the player connects.
        minSdk 31
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile = rootProject.file(uploadKey.storeFile)
                storePassword = uploadKey.storePassword
                keyAlias = uploadKey.keyAlias
                keyPassword = uploadKey.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // The upload key when it is configured; otherwise the local debug key, which only
            // suits development installs.
            signingConfig = hasUploadKey ? signingConfigs.upload : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The client's runtime assets, read through Bevy's AndroidAssetReader.
            assets.srcDirs = [file('../../../../assets')]
            // Written by `just android-build` (cargo ndk -o ...); ignored by git.
            jniLibs.srcDirs = [file('src/main/jniLibs')]
        }
    }

    packaging {
        jniLibs {
            // The `android` Cargo profile already strips the library.
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    // Must match the `android-activity` crate that Bevy 0.19 uses (0.6.1 -> 4.4.0).
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
