[package]
name = "brawler"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Brawler — a server-authoritative top-down arena shooter"
publish = false
# `network` and `performance` belong to `packages/brawler-client`; see the explicit targets below.
autotests = false

[workspace]
members = [
  "packages/brawler-android",
  "packages/brawler-client",
  "packages/brawler-routing",
]
resolver = "3"

[features]
default = ["client"]
# Client-side protocol registrations and the client adapters that live beside their shared domain
# (combat cues/preview, map presentation readiness, combat evidence). The player application
# itself is the `brawler-client` package (BRL-0170).
client = [
  "dep:atomic-write-file",
  "dep:serde_json",
  "bevy-client",
  "avian2d/serialize",
  "lightyear/client",
  "lightyear/avian2d",
  "lightyear/netcode",
  "lightyear/input_native",
  "lightyear/interpolation",
  "lightyear/replication",
  "lightyear/udp",
]
server = [
  "dep:rusqlite",
  "bevy-server",
  "avian2d/serialize",
  "lightyear/avian2d",
  "lightyear/input_native",
  "lightyear/interpolation",
  "lightyear/netcode",
  "lightyear/replication",
  "lightyear/server",
  "lightyear/udp",
]
network-test = [
  "client",
  "server",
  "lightyear/client",
  "lightyear/crossbeam",
  "lightyear/avian2d",
  "lightyear/input_native",
  "lightyear/interpolation",
  "lightyear/netcode",
  "lightyear/replication",
  "lightyear/server",
]
balance-lab = [
  "server",
  "dep:atomic-write-file",
  "dep:serde_json",
  "dep:tiny_http",
]
# Process-global Lightyear metrics for dedicated measurement builds only. Never nested in
# client, server, or network-test: the metrics recorder is one per OS process, so
# separate-App tests must keep per-World isolation.
process-metrics = ["lightyear/metrics"]
bevy-client = [
  "bevy/bevy_asset",
  "bevy/bevy_audio",
  "bevy/bevy_core_pipeline",
  "bevy/bevy_gilrs",
  "bevy/bevy_gltf",
  "bevy/bevy_pbr",
  "bevy/bevy_post_process",
  "bevy/bevy_render",
  "bevy/bevy_scene",
  "bevy/bevy_text",
  "bevy/bevy_ui",
  "bevy/bevy_ui_render",
  "bevy/bevy_winit",
  "bevy/bevy_window",
  "bevy/default_font",
  # BRL-0168: per-script fallback to the OS fonts for glyphs Lilita One lacks (player names).
  "bevy/system_font_discovery",
  "bevy/gamepad",
  "bevy/gltf_animation",
  "bevy/png",
  "bevy/vorbis",
  "bevy/keyboard",
  "bevy/mouse",
  "bevy/reflect_auto_register",
  "bevy/serialize",
  "bevy/sysinfo_plugin",
  "bevy/bevy_input_focus",
  # BRL-0146: filmic tonemapping LUTs (KTX2 + pure-Rust zstd) for the HDR world camera.
  "bevy/tonemapping_luts",
  "bevy/zstd_rust",
]
bevy-server = []
# Shared Bevy app-test helpers (`brawler::test_app`) for the `brawler-client` unit tests only.
test-support = []

[dependencies]
avian2d = { version = "=0.7.0", default-features = false, features = [
  "2d",
  "f32",
  "parry-f32",
  "serialize",
] }
brawler-routing = { path = "packages/brawler-routing" }
bevy = { version = "=0.19.1", default-features = false, features = [
  "async_executor",
  "bevy_log",
  "bevy_state",
  "multi_threaded",
  "std",
] }
lightyear = { version = "=0.29.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
ron = "0.12"
serde_json = { version = "1.0", optional = true }
tiny_http = { version = "0.12", optional = true }
sha2 = "0.10"
getrandom = "0.3"
unicode-normalization = "0.1"
unicode-segmentation = "1"
atomic-write-file = { version = "0.3", optional = true }
rusqlite = { version = "0.40.0", features = ["backup", "bundled"], optional = true }

[[bin]]
name = "brawler-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "brawler-profile-admin"
path = "src/bin/profile_admin.rs"
required-features = ["server"]

[[test]]
name = "map_public_api"
path = "tests/map_public_api.rs"

[[test]]
name = "routed-process"
path = "tests/routed_process.rs"
required-features = ["network-test"]

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Workspace crates keep line tables so panics and backtraces still show file:line; dependencies drop
# debuginfo. Cuts codegen, link time, and target/ size (BRL-r8ev).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Android player library (`just android-build`): optimized, stripped, abort-on-panic. Fat LTO
# with one codegen unit cuts the .so by about a third (BRL-5k0g); cold-crate `opt-level = "s"`
# and Bevy feature trims measured under 1 % and were not applied.
# Desktop and server profiles are unaffected.
[profile.android]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
