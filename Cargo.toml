[package]
name = "brawler"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Brawler — a server-authoritative top-down arena shooter"
publish = false

[features]
default = ["client"]
client = [
  "bevy-client",
  "avian2d/serialize",
  "lightyear/client",
  "lightyear/avian2d",
  "lightyear/netcode",
  "lightyear/input_native",
  "lightyear/interpolation",
  "lightyear/replication",
  "lightyear/udp",
]
server = [
  "bevy-server",
  "avian2d/serialize",
  "lightyear/avian2d",
  "lightyear/input_native",
  "lightyear/interpolation",
  "lightyear/netcode",
  "lightyear/replication",
  "lightyear/server",
  "lightyear/udp",
]
network-test = [
  "client",
  "server",
  "lightyear/client",
  "lightyear/crossbeam",
  "lightyear/avian2d",
  "lightyear/input_native",
  "lightyear/interpolation",
  "lightyear/netcode",
  "lightyear/replication",
  "lightyear/server",
]
# Process-global Lightyear metrics for dedicated measurement builds only. Never nested in
# client, server, or network-test: the metrics recorder is one per OS process, so
# separate-App tests must keep per-World isolation.
process-metrics = ["lightyear/metrics"]
bevy-client = [
  "bevy/bevy_asset",
  "bevy/bevy_audio",
  "bevy/bevy_core_pipeline",
  "bevy/bevy_gilrs",
  "bevy/bevy_render",
  "bevy/bevy_sprite",
  "bevy/bevy_text",
  "bevy/bevy_ui",
  "bevy/bevy_ui_render",
  "bevy/bevy_winit",
  "bevy/bevy_window",
  "bevy/default_font",
  "bevy/gamepad",
  "bevy/png",
  "bevy/vorbis",
  "bevy/keyboard",
  "bevy/mouse",
]
bevy-server = []

[dependencies]
avian2d = { version = "=0.7.0", default-features = false, features = [
  "2d",
  "f32",
  "parry-f32",
  "serialize",
] }
bevy = { version = "=0.19.1", default-features = false, features = [
  "async_executor",
  "bevy_log",
  "bevy_state",
  "multi_threaded",
  "std",
] }
lightyear = { version = "=0.29.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
ron = "0.12"

[[bin]]
name = "brawler-client"
path = "src/bin/client.rs"
required-features = ["client"]

[[bin]]
name = "brawler-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[test]]
name = "network"
path = "tests/network.rs"
required-features = ["network-test"]

[[test]]
name = "performance"
path = "tests/performance.rs"
required-features = ["network-test"]

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
