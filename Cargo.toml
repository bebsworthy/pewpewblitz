[package]
name = "brawler"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Brawler — a server-authoritative top-down arena shooter"
publish = false

[workspace]
members = ["packages/brawler-android", "packages/brawler-routing"]
resolver = "3"

[features]
default = ["client"]
client = [
  "dep:arboard",
  "dep:atomic-write-file",
  "dep:bevy_hanabi",
  "dep:directories",
  "dep:serde_json",
  "bevy-client",
  "avian2d/serialize",
  "lightyear/client",
  "lightyear/avian2d",
  "lightyear/netcode",
  "lightyear/input_native",
  "lightyear/interpolation",
  "lightyear/replication",
  "lightyear/udp",
]
server = [
  "dep:rusqlite",
  "bevy-server",
  "avian2d/serialize",
  "lightyear/avian2d",
  "lightyear/input_native",
  "lightyear/interpolation",
  "lightyear/netcode",
  "lightyear/replication",
  "lightyear/server",
  "lightyear/udp",
]
# Scripted smoke/demo drivers, scheduled captures, native render reports, and developer-only
# review tools (VfxLab, UI gallery). Never in `default` or `client`: the player build is
# `--features client` and must not contain this code (scripts/check-client-features.sh).
automation = ["client"]
network-test = [
  "client",
  "automation",
  "server",
  "lightyear/client",
  "lightyear/crossbeam",
  "lightyear/avian2d",
  "lightyear/input_native",
  "lightyear/interpolation",
  "lightyear/netcode",
  "lightyear/replication",
  "lightyear/server",
]
balance-lab = [
  "server",
  "dep:atomic-write-file",
  "dep:serde_json",
  "dep:tiny_http",
]
# Process-global Lightyear metrics for dedicated measurement builds only. Never nested in
# client, server, or network-test: the metrics recorder is one per OS process, so
# separate-App tests must keep per-World isolation.
process-metrics = ["lightyear/metrics"]
bevy-client = [
  "bevy/bevy_asset",
  "bevy/bevy_audio",
  "bevy/bevy_core_pipeline",
  "bevy/bevy_gilrs",
  "bevy/bevy_gltf",
  "bevy/bevy_pbr",
  "bevy/bevy_post_process",
  "bevy/bevy_render",
  "bevy/bevy_scene",
  "bevy/bevy_text",
  "bevy/bevy_ui",
  "bevy/bevy_ui_render",
  "bevy/bevy_winit",
  "bevy/bevy_window",
  "bevy/default_font",
  "bevy/gamepad",
  "bevy/gltf_animation",
  "bevy/png",
  "bevy/vorbis",
  "bevy/keyboard",
  "bevy/mouse",
  "bevy/reflect_auto_register",
  "bevy/serialize",
  "bevy/sysinfo_plugin",
  "bevy/bevy_input_focus",
  # BRL-0146: filmic tonemapping LUTs (KTX2 + pure-Rust zstd) for the HDR world camera.
  "bevy/tonemapping_luts",
  "bevy/zstd_rust",
]
bevy-server = []

[dependencies]
avian2d = { version = "=0.7.0", default-features = false, features = [
  "2d",
  "f32",
  "parry-f32",
  "serialize",
] }
brawler-routing = { path = "packages/brawler-routing" }
bevy = { version = "=0.19.1", default-features = false, features = [
  "async_executor",
  "bevy_log",
  "bevy_state",
  "multi_threaded",
  "std",
] }
bevy_hanabi = { version = "=0.19.0", default-features = false, features = ["3d"], optional = true }
lightyear = { version = "=0.29.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
ron = "0.12"
serde_json = { version = "1.0", optional = true }
tiny_http = { version = "0.12", optional = true }
sha2 = "0.10"
getrandom = "0.3"
unicode-normalization = "0.1"
unicode-segmentation = "1"
atomic-write-file = { version = "0.3", optional = true }
directories = { version = "6.0", optional = true }
rusqlite = { version = "0.40.0", features = ["backup", "bundled"], optional = true }

# `arboard` has no Android backend; Android paste reports unavailable (BRL-0159).
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6", default-features = false, optional = true }

[dev-dependencies]
# Glyph-coverage tests read the shipped display font's character map.
skrifa = "=0.44.0"

[[bin]]
name = "brawler-client"
path = "src/bin/client.rs"
required-features = ["client"]

[[bin]]
name = "brawler-vfx-lab"
path = "src/bin/vfx_lab.rs"
required-features = ["client", "automation"]

[[bin]]
name = "brawler-ui-gallery"
path = "src/bin/ui_gallery.rs"
required-features = ["client", "automation"]

[[bin]]
name = "brawler-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "brawler-profile-admin"
path = "src/bin/profile_admin.rs"
required-features = ["server"]

[[test]]
name = "network"
path = "tests/network.rs"
required-features = ["network-test"]

[[test]]
name = "performance"
path = "tests/performance.rs"
required-features = ["network-test"]

[[test]]
name = "routed-process"
path = "tests/routed_process.rs"
required-features = ["network-test"]

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Android player library (`just android-build`): optimized, thin-LTO, stripped, abort-on-panic.
# Desktop and server profiles are unaffected.
[profile.android]
inherits = "release"
lto = "thin"
strip = true
panic = "abort"
